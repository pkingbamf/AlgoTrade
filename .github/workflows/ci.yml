name: quant-box-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd quant-box
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: |
          cd quant-box
          pytest -q

      - name: Compile check
        run: |
          cd quant-box
          python -m compileall app monitoring risk backtests tests
